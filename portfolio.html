<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Lauren Wilson | Portfolio</title>
    <meta name="description" content="Selected projects from computer science, web development, creative coding and digital art by Lauren Wilson.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip" href="#main">Skip to main content</a>

    <header>
      <div class="w">
        <a class="logo hand" href="index.html">Lauren Wilson</a>
        <nav aria-label="Main">
          <ul>
            <li><a href="index.html">Bio</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li><a href="portfolio.html" aria-current="page">Portfolio</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main">
      <div class="w">
        <section class="intro">
          <h1 id="h-port"><span>Selected work</span></h1>
          <p class="lede">Projects from computer science, web development, creative coding, and digital art.</p>
        </section>

        <section class="binder-gallery" aria-label="Portfolio image gallery">
          <div class="binder-stage">
            <button class="gallery-arrow prev" type="button" aria-label="Previous page">&#8592;</button>

            <div class="binder" id="portfolioGallery" tabindex="0">
              <div class="spiral" aria-hidden="true">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span>
              </div>

              <div class="binder-spread">
                <article class="binder-page binder-left">
                  <button class="image-button" id="leftImageButton" type="button" aria-label="Open portfolio image">
                    <span class="photo-frame">
                      <img id="leftImage" src="" alt="">
                    </span>
                  </button>
                  <p class="page-label" id="leftLabel"></p>
                </article>

                <article class="binder-page binder-right">
                  <button class="image-button" id="rightImageButton" type="button" aria-label="Open portfolio image">
                    <span class="photo-frame">
                      <img id="rightImage" src="" alt="">
                    </span>
                  </button>
                  <p class="page-label" id="rightLabel"></p>
                </article>
              </div>

              <div class="flip-sheet" id="flipSheet" aria-hidden="true">
                <div class="flip-face flip-front">
                  <span class="photo-frame">
                    <img id="flipFrontImage" src="" alt="">
                  </span>
                  <p class="page-label" id="flipFrontLabel"></p>
                </div>
                <div class="flip-face flip-back">
                  <span class="photo-frame">
                    <img id="flipBackImage" src="" alt="">
                  </span>
                  <p class="page-label" id="flipBackLabel"></p>
                </div>
              </div>
            </div>

            <button class="gallery-arrow next" type="button" aria-label="Next page">&#8594;</button>
          </div>

          <div class="gallery-controls">
            <div class="gallery-dots" id="galleryDots" role="tablist" aria-label="Choose portfolio page"></div>
            <p class="gallery-hint">turn the page <span aria-hidden="true">↗</span></p>
          </div>
        </section>
      </div>
    </main>

    <div class="image-modal" id="imageModal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" type="button" aria-label="Close enlarged image">&#215;</button>
        <p class="modal-title hand" id="modalTitle">Portfolio image</p>
        <img id="modalImage" src="" alt="">
      </div>
    </div>

    <footer>
      <div class="w">
        <span class="hand">Lauren Wilson</span>
        <span>Raleigh, NC</span>
        <a href="mailto:laurenwilsonlnw@gmail.com">laurenwilsonlnw@gmail.com</a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
